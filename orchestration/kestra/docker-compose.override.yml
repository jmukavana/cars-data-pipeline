services:
  postgres:
    image: docker.io/library/postgres:18


  kestra:
    image: docker.io/kestra/kestra:latest
    security_opt:
      - label=disable
    volumes:
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd

    env_file:
      - .env.cars-secret