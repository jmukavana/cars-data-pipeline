[project]
name = "cars-data-pipeline"
version = "0.1.0"
description = "Validated car-listing batch pipeline with PostgreSQL, dbt, and Parquet outputs"
readme = "README.md"
authors = [
    { name = "jamlechluvonga", email = "jamlechluvonga@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dbt-postgres>=1.11.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow==26.0.0",
]

[project.scripts]
cars-data-pipeline = "cars_data_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
